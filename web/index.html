<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8F0FD">
<title>AI 실시간 이슈</title>
<style>
  :root {
    --bg-top: #E8F0FD;
    --bg-mid: #EDF2FA;
    --bg: #F4F6F9;
    --card: #FFFFFF;
    --text: #191F28;
    --text-sub: #8B95A1;
    --text-dim: #B0B8C1;
    --up: #F04452;
    --down: #3182F6;
    --accent: #3182F6;
    --badge-hot-bg: #FEECEE;
    --badge-hot-fg: #F04452;
    --badge-new-bg: #EDF3FE;
    --badge-new-fg: #3182F6;
    --tab-line: #E2E7EC;
    --chip-bg: #EDF0F3;
    --line: #F0F2F5;
    --gutter: 20px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* 문서가 스크롤된다. 사파리는 문서가 스크롤될 때만 하단 도구 막대를
     반투명 알약으로 접고, 그때 목록이 그 뒤로 비친다. */
  /* 사파리는 첫 화면에서 body 의 배경색을 상태 표시줄 색으로 쓰고,
     스크롤한 뒤에는 화면에 그려진 색을 다시 읽는다. 두 경우가 같으려면
     body 도 위쪽 색이어야 한다. 목록이 놓이는 회색은 페이저가 직접 갖는다. */
  html { background: var(--bg-top); }

  body {
    margin: 0; background: var(--bg-top);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard,
                 "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app { max-width: 560px; margin: 0 auto; }
  .pad { padding: 0 var(--gutter); }

  /* ---------- 위쪽 고정 영역 ----------
     스크롤하면 눈썹 문구가 사라지고 제목이 한 줄로 줄어든다.
     그라데이션을 이 영역이 직접 가지므로 스크롤 위치와 무관하게 항상 같다.
     상태 표시줄부터 탭 구분선까지가 이 영역이고, 그 아래는 목록 배경색이다. */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    padding-top: env(safe-area-inset-top);
    background: linear-gradient(180deg, var(--bg-top) 0, var(--bg-mid) 100%);
  }

  .eyebrow {
    display: flex; align-items: center; gap: 8px; overflow: hidden;
    color: var(--accent); font-size: 15px; font-weight: 700;
    line-height: 1; height: 20px; margin: 24px 0 8px; opacity: 1;
    transform-origin: left center; will-change: transform, opacity;
    transition: height .24s cubic-bezier(.22,.61,.36,1),
                margin .24s cubic-bezier(.22,.61,.36,1),
                transform .24s cubic-bezier(.22,.61,.36,1),
                opacity .16s linear;
  }
  .eyebrow svg { width: 20px; height: 20px; display: block; flex: none; }

  .titlebar {
    display: flex; align-items: center; gap: 8px; padding-bottom: 16px;
    transition: padding-bottom .24s cubic-bezier(.22,.61,.36,1);
  }
  h1 {
    margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px;
    transform-origin: left center; will-change: transform;
    transition: transform .24s cubic-bezier(.22,.61,.36,1);
  }
  .actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }


  .compact .eyebrow { height: 0; margin: 12px 0 0; opacity: 0; transform: translateY(-8px); }
  .compact h1 { transform: scale(.7); }
  .compact .titlebar { padding-bottom: 8px; }

  .updated { font-size: 13px; color: var(--text-dim); white-space: nowrap; }

  /* ---------- 탭 ---------- */
  .tabs {
    overflow-x: auto; border-bottom: 1px solid var(--tab-line);
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabrow { position: relative; display: flex; padding: 0 12px; width: max-content; min-width: 100%; }
  .tabrow button {
    flex: none; border: 0; background: transparent; cursor: pointer; font: inherit;
    font-size: 16px; font-weight: 700; letter-spacing: -0.3px;
    color: var(--text-dim); padding: 12px 12px 12px; white-space: nowrap;
    transition: color .18s;
  }
  .tabrow button[aria-current="true"] { color: var(--text); }
  .ink {
    position: absolute; left: 0; bottom: 0; height: 3px; width: 100px;
    border-radius: 2px; background: var(--text);
    transform-origin: left center; transform: translateX(0) scaleX(0);
    will-change: transform;
  }

  /* ---------- 페이저 ----------
     가로 이동은 브라우저의 스크롤 스냅에 맡긴다.
     세로 스크롤은 문서가 담당하므로 페이지는 자기 높이를 그대로 쓴다. */
  .pager {
    background: var(--card);
    display: flex; align-items: flex-start;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .pager::-webkit-scrollbar { display: none; }

  .page {
    flex: 0 0 100%; width: 100%; min-width: 0;
    scroll-snap-align: start; scroll-snap-stop: always;
    padding: 0 var(--gutter) calc(88px + env(safe-area-inset-bottom));
  }

  /* ---------- 카드 ---------- */
  .list { display: flex; flex-direction: column; padding-top: 4px; }

  .row { border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .head {
    display: grid; grid-template-columns: 28px minmax(0, 1fr);
    gap: 12px; align-items: start;
    padding: 16px 0; cursor: pointer;
  }
  .head > div { min-width: 0; }
  .rank {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 17px; font-weight: 700; line-height: 1.45;
  }

  .titleline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.45; }

  .badge {
    font-size: 11px; font-weight: 700; padding: 4px 8px;
    border-radius: 8px; white-space: nowrap;
  }
  .badge.surge { background: var(--badge-hot-bg); color: var(--badge-hot-fg); }
  .badge.new   { background: var(--badge-new-bg); color: var(--badge-new-fg); }

  .arrow { font-size: 13px; line-height: 1; }
  .arrow.up { color: var(--up); }
  .arrow.down { color: var(--down); }
  .detail {
    margin: 0 0 4px; font-size: 15px; color: var(--text-sub);
    letter-spacing: -0.2px; line-height: 1.5;
  }

  .meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .axis {
    font-size: 11px; font-weight: 600; color: var(--text-dim);
    background: var(--chip-bg); padding: 4px 8px; border-radius: 4px;
  }
  .count { font-size: 13px; color: var(--text-dim); font-weight: 500; }

  .sources { display: none; padding: 0 0 12px 40px; }
  .row.open .sources { display: block; }
  .sources a {
    display: block; padding: 12px 0; text-decoration: none; color: var(--text);
    border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.5;
  }
  .sources a:last-child { border-bottom: 0; }
  .sources .when { color: var(--text-dim); font-size: 12px; display: block; margin-top: 4px; }

  .empty, .error {
    padding: 48px 20px; text-align: center;
    color: var(--text-sub); font-size: 15px;
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar" id="topbar">
    <div class="pad">
      <div class="eyebrow">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 6.1L20.5 10l-6.3 1.9L12 18l-2.2-6.1L3.5 10l6.3-1.9L12 2z"/></svg>
        AI 소식을 모아서
      </div>
      <div class="titlebar">
        <h1>지금 많이 언급되는 이슈</h1>
        <div class="actions" id="actions">
          <span class="updated" id="updated"></span>
        </div>
      </div>
    </div>

    <div class="tabs" id="tabs">
      <div class="tabrow" id="tabrow"><span class="ink" id="ink"></span></div>
    </div>
  </div>

  <div class="pager" id="pager"></div>
</div>

<script>
const AXES = [
  ["llm", "LLM/서비스"],
  ["media", "영상/이미지"],
  ["hardware", "하드웨어"],
  ["capital", "기업/자본"],
];
const AXIS_NAME = Object.fromEntries(AXES);
const BADGE = { surge: ["급상승", "surge"], new: ["새로 진입", "new"] };
const SECTIONS = [["all", "전체"]].concat(AXES);
const SECTION_LIMIT = 20;
const INK_BASE = 100;
const COMPACT_AT = 8;
const STORE_SECTION = "ai-issues.section";

const app = document.getElementById("app");
const topbar = document.getElementById("topbar");
const tabs = document.getElementById("tabs");
const tabrow = document.getElementById("tabrow");
const ink = document.getElementById("ink");
const pager = document.getElementById("pager");

let data = { issues: [] };
let index = Math.max(0, SECTIONS.findIndex(([k]) => k === read(STORE_SECTION, "all")));
let geometry = [];
let near = -1;

function read(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (e) { return fallback; }
}
function write(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

function ago(iso) {
  if (!iso) return "";
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "방금 전";
  if (mins < 60) return mins + "분 전";
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + "시간 전";
  return Math.floor(hours / 24) + "일 전";
}

function arrow(issue) {
  if (issue.prev_rank == null) return "";
  const diff = issue.prev_rank - issue.rank;
  if (diff > 0) return '<span class="arrow up">▲</span>';
  if (diff < 0) return '<span class="arrow down">▼</span>';
  return "";
}

function escape(text) {
  return String(text == null ? "" : text).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- 그리기 ---------- */

function issuesFor(key) {
  const list = key === "all"
    ? data.issues.slice()
    : data.issues.filter(i => i.axis === key);
  // 정렬은 최신순 하나로 고정한다. 화면에서 고르는 자리를 없앴다.
  list.sort((a, b) => String(b.last_seen || "").localeCompare(String(a.last_seen || "")));
  return list.slice(0, SECTION_LIMIT);
}

function cardHtml(issue, position) {
  const badge = BADGE[issue.badge];
  const sources = (issue.sources || []).map(s =>
    `<a href="${escape(s.url)}" target="_blank" rel="noopener">${escape(s.name)}
       <span class="when">${ago(s.published_at)}</span></a>`).join("");
  return `<div class="row">
    <div class="head">
      <div class="rank">${position}${arrow(issue)}</div>
      <div>
        <div class="titleline">
          <span class="title">${escape(issue.title)}</span>
          ${badge ? `<span class="badge ${badge[1]}">${badge[0]}</span>` : ""}
        </div>
        <div class="meta">
          <span class="axis">${AXIS_NAME[issue.axis] || issue.axis}</span>
          <span class="count">${issue.source_count}개 출처 · ${ago(issue.last_seen)}</span>
        </div>
      </div>
    </div>
    <div class="sources">
      <p class="detail">${escape(issue.subtitle)}</p>
      ${sources}
    </div>
  </div>`;
}

function renderTabs() {
  tabrow.querySelectorAll("button").forEach(b => b.remove());
  SECTIONS.forEach(([, label], i) => {
    const button = document.createElement("button");
    button.textContent = label;
    button.dataset.index = i;
    button.setAttribute("aria-current", String(i === index));
    tabrow.insertBefore(button, ink);
  });
  geometry = [...tabrow.querySelectorAll("button")].map(b => ({
    left: b.offsetLeft + 10,
    width: Math.max(0, b.offsetWidth - 20),
  }));
}

function renderPages() {
  pager.innerHTML = SECTIONS.map(([key]) => {
    const list = issuesFor(key);
    const body = list.length
      ? list.map((issue, i) => cardHtml(issue, i + 1)).join("")
      : '<div class="empty">이 섹션에 표시할 이슈가 없다.</div>';
    return `<div class="page"><div class="list">${body}</div></div>`;
  }).join("");
}

/* 섹션마다 카드 수가 다르다. 페이저 높이를 현재 섹션에 맞추되 최소한
   화면 끝까지는 채운다. 카드가 없는 아래쪽에서도 스와이프가 먹어야 한다. */
let pageHeights = [];

function measurePages() {
  pageHeights = [...pager.children].map(page => page.offsetHeight);
}

function floorHeight() {
  return Math.max(240, window.innerHeight - topbar.offsetHeight);
}

function setPagerHeight(px) {
  const next = Math.round(px) + "px";
  if (pager.style.height !== next) pager.style.height = next;
}

function syncHeight() {
  measurePages();
  setPagerHeight(Math.max(floorHeight(), pageHeights[index] || 0));
}

/* 이동 중에는 지나가는 두 섹션 중 큰 쪽에 맞춘다. 짧은 섹션 높이에
   묶여 있으면 다음 섹션이 잘려 보인다. 줄이지는 않는다. */
function spanHeight(ratio) {
  const lo = Math.floor(ratio);
  const hi = Math.min(lo + 1, pageHeights.length - 1);
  const want = Math.max(floorHeight(), pageHeights[lo] || 0, pageHeights[hi] || 0);
  if (want > pager.offsetHeight) setPagerHeight(want);
}

/* ---------- 탭 밑줄 ---------- */

function moveInk() {
  if (!geometry.length) return;
  const width = pager.clientWidth || 1;
  const ratio = Math.max(0, Math.min(SECTIONS.length - 1, pager.scrollLeft / width));
  const i = Math.floor(ratio);
  const f = ratio - i;
  const a = geometry[i];
  const b = geometry[Math.min(i + 1, geometry.length - 1)];
  if (!a || !b) return;
  const left = a.left + (b.left - a.left) * f;
  const w = a.width + (b.width - a.width) * f;
  ink.style.transform = `translateX(${left}px) scaleX(${w / INK_BASE})`;

  spanHeight(ratio);

  setActive(Math.round(ratio));
}

/* 현재 섹션을 바꾼다. 밑줄 갱신과 이동 종료 처리 양쪽에서 부른다. */
function setActive(now) {
  if (now === near) return;
  near = now;
  index = now;
  write(STORE_SECTION, SECTIONS[index][0]);
  tabrow.querySelectorAll("button").forEach((button, n) =>
    button.setAttribute("aria-current", String(n === now)));
  centerTab();
}

/* 가로 이동이 멈춘 뒤에 높이를 맞춘다. 이동 중에 레이아웃을 바꾸면
   진행 중인 스크롤이 밀려서 목록이 좌우로 튕긴다. */
function afterSlide() {
  // 스크롤 위치에서 직접 구한다. 밑줄 갱신이 늦어도 높이는 맞아야 한다.
  const width = pager.clientWidth || 1;
  setActive(Math.max(0, Math.min(SECTIONS.length - 1, Math.round(pager.scrollLeft / width))));

  const top = pager.offsetTop - topbar.offsetHeight;
  const before = pager.offsetHeight;
  syncHeight();
  if (pager.offsetHeight !== before && window.scrollY > top) window.scrollTo(0, top);
}

function centerTab() {
  const button = tabrow.querySelectorAll("button")[index];
  if (!button) return;
  const want = button.offsetLeft + button.offsetWidth / 2 - tabs.clientWidth / 2;
  const max = Math.max(0, tabs.scrollWidth - tabs.clientWidth);
  tabs.scrollTo({ left: Math.max(0, Math.min(max, want)), behavior: "smooth" });
}

let inkTick = false;
let slideTimer = null;
pager.addEventListener("scroll", () => {
  if (!inkTick) {
    inkTick = true;
    requestAnimationFrame(() => { moveInk(); inkTick = false; });
  }
  clearTimeout(slideTimer);
  slideTimer = setTimeout(afterSlide, 150);
}, { passive: true });

/* 문서를 내리면 헤더를 접는다. */
let headTick = false;
window.addEventListener("scroll", () => {
  if (headTick) return;
  headTick = true;
  requestAnimationFrame(() => {
    app.classList.toggle("compact", window.scrollY > COMPACT_AT);
    headTick = false;
  });
}, { passive: true });

tabrow.addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button) return;
  pager.scrollTo({ left: Number(button.dataset.index) * pager.clientWidth, behavior: "smooth" });
});

pager.addEventListener("click", event => {
  const head = event.target.closest(".head");
  if (!head) return;
  head.parentElement.classList.toggle("open");
  syncHeight();
});

/* 가로 폭이 바뀔 때만 다시 잡는다. iOS 는 주소 표시줄이 접히고 펴질 때마다
   resize 를 보내는데, 그때마다 위치를 다시 잡으면 화면이 튄다. */
let lastWidth = window.innerWidth;
window.addEventListener("resize", () => {
  if (window.innerWidth === lastWidth) return;
  lastWidth = window.innerWidth;
  renderTabs();
  pager.scrollLeft = index * pager.clientWidth;
  syncHeight();
  moveInk();
});

/* ---------- 시작 ---------- */

fetch("../data/issues.json", { cache: "no-store" })
  .then(response => response.json())
  .then(json => {
    data = json;
    document.getElementById("updated").textContent = ago(json.generated_at);
    renderTabs();
    renderPages();
    pager.scrollLeft = index * pager.clientWidth;
    near = index;
    syncHeight();
    moveInk();
    centerTab();
  })
  .catch(() => {
    pager.innerHTML = '<div class="page"><div class="error">데이터를 불러오지 못했다.</div></div>';
  });
</script>
</body>
</html>

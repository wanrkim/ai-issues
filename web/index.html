<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF3FB">
<title>AI 실시간 이슈</title>
<style>
  :root {
    --bg-top: #E8F0FD;
    --bg: #F4F6F9;
    --card: #FFFFFF;
    --text: #191F28;
    --text-sub: #8B95A1;
    --text-dim: #B0B8C1;
    --up: #F04452;
    --down: #3182F6;
    --accent: #3182F6;
    --badge-hot-bg: #FEECEE;
    --badge-hot-fg: #F04452;
    --badge-new-bg: #EDF3FE;
    --badge-new-fg: #3182F6;
    --chip-off-bg: #EDF0F3;
    --chip-on-bg: #191F28;
    --line: #F0F2F5;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(17,24,39,.04);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard,
                 "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .sky {
    position: fixed; inset: 0 0 auto 0; height: 340px; z-index: 0;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 100%);
  }

  .wrap {
    position: relative; z-index: 1;
    max-width: 560px; margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 20px calc(48px + env(safe-area-inset-bottom));
  }

  /* ---------- 헤더 ---------- */
  .eyebrow {
    display: flex; align-items: center; gap: 6px;
    color: var(--accent); font-size: 15px; font-weight: 700;
    margin: 28px 0 6px;
  }
  .eyebrow svg { width: 17px; height: 17px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }

  .bar {
    display: flex; align-items: center; gap: 8px;
    margin: 24px 0 14px;
  }
  .seg { display: flex; gap: 4px; }
  .seg button {
    border: 0; background: transparent; cursor: pointer;
    font: inherit; font-size: 15px; font-weight: 700;
    color: var(--text-dim); padding: 8px 14px; border-radius: 10px;
  }
  .seg button[aria-pressed="true"] { background: #E5E9EE; color: var(--text); }
  .updated { margin-left: auto; font-size: 13px; color: var(--text-dim); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .chips button {
    border: 0; cursor: pointer; font: inherit;
    font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 999px;
    background: var(--chip-off-bg); color: var(--text-dim);
    transition: background .15s, color .15s;
  }
  .chips button[aria-pressed="true"] { background: var(--chip-on-bg); color: #fff; }

  /* ---------- 카드 ---------- */
  .list { display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .head {
    display: grid; grid-template-columns: 26px 1fr 20px;
    gap: 10px; align-items: start;
    padding: 18px 16px; cursor: pointer;
  }
  .rank { font-size: 17px; font-weight: 700; text-align: center; line-height: 1.45; }

  .titleline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.45; }

  .badge {
    font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; white-space: nowrap;
  }
  .badge.surge { background: var(--badge-hot-bg); color: var(--badge-hot-fg); }
  .badge.new   { background: var(--badge-new-bg); color: var(--badge-new-fg); }

  .subline { display: flex; align-items: center; gap: 5px; margin-top: 4px; }
  .arrow { font-size: 11px; line-height: 1; flex: none; }
  .arrow.up { color: var(--up); }
  .arrow.down { color: var(--down); }
  .arrow.flat { color: var(--text-dim); }
  .subtitle { font-size: 15px; color: var(--text-sub); letter-spacing: -0.2px; }

  .meta { display: flex; align-items: center; gap: 6px; margin-top: 9px; }
  .axis {
    font-size: 11px; font-weight: 600; color: var(--text-dim);
    background: var(--chip-off-bg); padding: 2px 7px; border-radius: 5px;
  }
  .count { font-size: 13px; color: var(--text-dim); font-weight: 500; }

  .chev { color: var(--text-dim); font-size: 15px; align-self: center; transition: transform .2s; }
  .card.open .chev { transform: rotate(90deg); }

  .sources { display: none; border-top: 1px solid var(--line); padding: 6px 16px 10px; }
  .card.open .sources { display: block; }
  .sources a {
    display: block; padding: 11px 0; text-decoration: none; color: var(--text);
    border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.5;
  }
  .sources a:last-child { border-bottom: 0; }
  .sources .name { color: var(--text-dim); font-size: 12px; display: block; margin-top: 3px; }

  .empty, .error {
    background: var(--card); border-radius: var(--radius); padding: 40px 20px;
    text-align: center; color: var(--text-sub); font-size: 15px; box-shadow: var(--shadow);
  }
</style>
</head>
<body>
<div class="sky"></div>
<div class="wrap">
  <div class="eyebrow">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 6.1L20.5 10l-6.3 1.9L12 18l-2.2-6.1L3.5 10l6.3-1.9L12 2z"/></svg>
    AI 소식을 모아서
  </div>
  <h1>지금 많이 언급되는 이슈</h1>

  <div class="bar">
    <div class="seg" id="sort">
      <button data-sort="popular" aria-pressed="true">인기순</button>
      <button data-sort="recent" aria-pressed="false">최신순</button>
    </div>
    <span class="updated" id="updated"></span>
  </div>

  <div class="chips" id="chips"></div>
  <div class="list" id="list"></div>
</div>

<script>
const AXES = [
  ["llm", "LLM/서비스"],
  ["media", "영상/이미지"],
  ["hardware", "하드웨어"],
  ["capital", "기업/자본"],
];
const AXIS_NAME = Object.fromEntries(AXES);
const BADGE = { surge: ["급상승", "surge"], new: ["새로 진입", "new"] };
const STORE_AXES = "ai-issues.excluded-axes";
const STORE_SORT = "ai-issues.sort";

let data = { issues: [] };
let sort = read(STORE_SORT, "popular");
let excluded = new Set(read(STORE_AXES, []));

function read(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (e) { return fallback; }
}
function write(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

function ago(iso) {
  if (!iso) return "";
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "방금 전";
  if (mins < 60) return mins + "분 전";
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + "시간 전";
  return Math.floor(hours / 24) + "일 전";
}

function arrow(issue) {
  if (issue.prev_rank == null) return ['<span class="arrow flat">•</span>', ""];
  const diff = issue.prev_rank - issue.rank;
  if (diff > 0) return ['<span class="arrow up">▲</span>', diff];
  if (diff < 0) return ['<span class="arrow down">▼</span>', -diff];
  return ['<span class="arrow flat">•</span>', ""];
}

function escape(text) {
  return String(text == null ? "" : text).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderChips() {
  document.getElementById("chips").innerHTML = AXES.map(([key, label]) =>
    `<button data-axis="${key}" aria-pressed="${!excluded.has(key)}">${label}</button>`
  ).join("");
}

function renderList() {
  const list = document.getElementById("list");
  let issues = data.issues.filter(i => !excluded.has(i.axis));

  if (sort === "recent") {
    issues = issues.slice().sort((a, b) =>
      String(b.last_seen || "").localeCompare(String(a.last_seen || "")));
  } else {
    issues = issues.slice().sort((a, b) => a.rank - b.rank);
  }

  if (!issues.length) {
    list.innerHTML = '<div class="empty">표시할 이슈가 없다.<br>축 필터를 확인해줘.</div>';
    return;
  }

  list.innerHTML = issues.map((issue, index) => {
    const [mark, diff] = arrow(issue);
    const badge = BADGE[issue.badge];
    const sources = (issue.sources || []).map(s =>
      `<a href="${escape(s.url)}" target="_blank" rel="noopener">${escape(s.name)}
         <span class="name">${ago(s.published_at)}</span></a>`).join("");
    return `<div class="card" data-id="${escape(issue.id)}">
      <div class="head">
        <div class="rank">${sort === "recent" ? index + 1 : issue.rank}</div>
        <div>
          <div class="titleline">
            <span class="title">${escape(issue.title)}</span>
            ${badge ? `<span class="badge ${badge[1]}">${badge[0]}</span>` : ""}
          </div>
          <div class="subline">${mark}<span class="subtitle">${escape(issue.subtitle)}</span></div>
          <div class="meta">
            <span class="axis">${AXIS_NAME[issue.axis] || issue.axis}</span>
            <span class="count">${issue.source_count}개 출처 · ${ago(issue.last_seen)}</span>
          </div>
        </div>
        <div class="chev">›</div>
      </div>
      <div class="sources">${sources}</div>
    </div>`;
  }).join("");
}

document.getElementById("sort").addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button) return;
  sort = button.dataset.sort;
  write(STORE_SORT, sort);
  document.querySelectorAll("#sort button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.sort === sort)));
  renderList();
});

document.getElementById("chips").addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button) return;
  const axis = button.dataset.axis;
  excluded.has(axis) ? excluded.delete(axis) : excluded.add(axis);
  write(STORE_AXES, [...excluded]);
  renderChips();
  renderList();
});

document.getElementById("list").addEventListener("click", event => {
  const head = event.target.closest(".head");
  if (head) head.parentElement.classList.toggle("open");
});

fetch("../data/issues.json", { cache: "no-store" })
  .then(response => response.json())
  .then(json => {
    data = json;
    document.getElementById("updated").textContent = ago(json.generated_at);
    document.querySelectorAll("#sort button").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.sort === sort)));
    renderChips();
    renderList();
  })
  .catch(() => {
    document.getElementById("list").innerHTML =
      '<div class="error">데이터를 불러오지 못했다.</div>';
  });
</script>
</body>
</html>

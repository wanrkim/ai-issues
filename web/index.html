<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8F0FD">
<title>AI 실시간 이슈</title>
<style>
  :root {
    --bg-top: #E8F0FD;
    --bg-soft: #F2F6FC;
    --bg: #F4F6F9;
    --card: #FFFFFF;
    --text: #191F28;
    --text-sub: #8B95A1;
    --text-dim: #B0B8C1;
    --up: #F04452;
    --down: #3182F6;
    --accent: #3182F6;
    --badge-hot-bg: #FEECEE;
    --badge-hot-fg: #F04452;
    --badge-new-bg: #EDF3FE;
    --badge-new-fg: #3182F6;
    --chip-bg: #EDF0F3;
    --line: #F0F2F5;
    --thumb-line: rgba(17,24,39,.08);
    --gutter: 20px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* 문서가 스크롤된다. 사파리는 문서가 스크롤될 때만 하단 도구 막대를
     반투명 알약으로 접고, 그때 목록이 그 뒤로 이어진다. */
  html { background: var(--bg-top); }

  body {
    margin: 0; background: var(--bg-top);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard,
                 "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app { max-width: 560px; margin: 0 auto; }
  .pad { padding: 0 var(--gutter); }

  /* ---------- 위쪽 고정 영역 ----------
     그라데이션을 이 영역이 직접 가지므로 스크롤 위치와 무관하게 항상 같다. */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    padding-top: env(safe-area-inset-top);
    background: linear-gradient(180deg, var(--bg-top) 0, var(--bg-soft) 100%);
  }

  .eyebrow {
    display: flex; align-items: center; gap: 8px; overflow: hidden;
    color: var(--accent); font-size: 15px; font-weight: 700;
    line-height: 1; height: 20px; margin: 24px 0 8px; opacity: 1;
    transition: height .24s cubic-bezier(.22,.61,.36,1),
                margin .24s cubic-bezier(.22,.61,.36,1),
                transform .24s cubic-bezier(.22,.61,.36,1),
                opacity .16s linear;
  }
  .eyebrow svg { width: 20px; height: 20px; display: block; flex: none; }

  .titlebar {
    display: flex; align-items: center; gap: 8px; padding-bottom: 16px;
    transition: padding-bottom .24s cubic-bezier(.22,.61,.36,1);
  }
  h1 {
    margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px;
    white-space: nowrap;
    transform-origin: left center; will-change: transform;
    transition: transform .24s cubic-bezier(.22,.61,.36,1);
  }

  /* 분류 선택. 기본 선택 요소는 가장 긴 항목의 폭에 맞춰지므로 짧은 이름을
     고르면 글자와 화살표 사이가 벌어진다. 보이는 부분을 직접 그리고
     선택 요소를 그 위에 투명하게 겹쳐서 기기 고유의 선택 화면은 그대로 쓴다. */
  .picker {
    position: relative; margin-left: auto; flex: none;
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 700; color: var(--text);
    padding: 4px 0; cursor: pointer;
  }
  .picker svg { width: 12px; height: 8px; display: block; flex: none; }
  .picker select {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; appearance: none; -webkit-appearance: none;
    border: 0; font: inherit; cursor: pointer;
  }

  .compact .eyebrow { height: 0; margin: 12px 0 0; opacity: 0; transform: translateY(-8px); }
  .compact h1 { transform: scale(.7); }
  .compact .titlebar { padding-bottom: 8px; }

  /* ---------- 목록 ----------
     흰 바탕 위에 항목을 두고 구분선으로 나눈다. 최소 높이를 화면 높이로
     두어 항목이 적을 때도 아래가 흰색으로 이어지고 문서가 스크롤된다. */
  .sheet {
    min-height: 100vh;
    background: linear-gradient(180deg, var(--bg-soft) 0, var(--card) 160px) no-repeat,
                var(--card);
  }
  .list { padding: 4px var(--gutter) calc(88px + env(safe-area-inset-bottom)); }

  .row { border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .head {
    display: grid; grid-template-columns: 28px minmax(0, 1fr) auto;
    gap: 12px; align-items: start;
    padding: 16px 0; cursor: pointer;
  }
  /* 섬네일 자리. 사진과 로고가 같은 크기를 차지한다. */
  .thumb-box {
    position: relative; width: 56px; height: 56px; flex: none;
  }

  /* 기사 사진. 상자를 꽉 채우고 옅은 윤곽선을 두른다.
     흰 배경 사진이 흰 바탕과 붙어 보이는 것을 막는다. */
  .thumb-box.photo {
    border-radius: 6px; overflow: hidden; background: var(--card);
  }
  /* 윤곽선은 이미지 위에 그려야 보인다. 상자에 안쪽 그림자를 주면
     그 위에 이미지가 덮여서 가려진다. */
  .thumb-box.photo::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    border-radius: 6px; box-shadow: inset 0 0 0 1px var(--thumb-line);
  }
  .thumb { width: 100%; height: 100%; display: block; object-fit: cover; }

  /* 기업 로고. 배경이 투명한 로고 그대로 보여준다. 테두리와 배경을 두지 않는다. */
  .thumb.logo {
    width: 40px; height: 40px; object-fit: contain;
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  }
  .head > div { min-width: 0; }
  .rank {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 17px; font-weight: 700; line-height: 1.45;
  }
  .arrow { font-size: 13px; line-height: 1; }
  .arrow.up { color: var(--up); }
  .arrow.down { color: var(--down); }

  .titleline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.45; }

  .badge {
    font-size: 11px; font-weight: 700; padding: 4px 8px;
    border-radius: 8px; white-space: nowrap;
  }
  .badge.surge { background: var(--badge-hot-bg); color: var(--badge-hot-fg); }
  .badge.new   { background: var(--badge-new-bg); color: var(--badge-new-fg); }

  .meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .axis {
    font-size: 11px; font-weight: 600; color: var(--text-dim);
    background: var(--chip-bg); padding: 4px 8px; border-radius: 4px;
  }
  .count { font-size: 13px; color: var(--text-dim); font-weight: 500; }

  /* ---------- 펼친 내용 ---------- */
  .sources { display: none; padding: 0 0 12px 40px; }
  .row.open .sources { display: block; }
  .detail {
    margin: 0 0 12px; font-size: 15px; color: var(--text);
    letter-spacing: -0.2px; line-height: 1.6; word-break: keep-all;
  }
  .sources a {
    display: flex; align-items: baseline; gap: 8px;
    padding: 4px 0; text-decoration: none; color: var(--accent);
    font-size: 13px; line-height: 1.6;
  }
  .sources a .name {
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sources .when { flex: none; color: var(--text-dim); font-size: 12px; }
  .more { margin: 4px 0 0; font-size: 12px; color: var(--text-dim); }

  .empty, .error {
    padding: 48px 20px; text-align: center;
    color: var(--text-sub); font-size: 15px;
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar" id="topbar">
    <div class="pad">
      <div class="eyebrow">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 6.1L20.5 10l-6.3 1.9L12 18l-2.2-6.1L3.5 10l6.3-1.9L12 2z"/></svg>
        AI 소식을 모아서
      </div>
      <div class="titlebar">
        <h1>지금 많이 언급되는 이슈</h1>
        <div class="picker">
          <span id="pickerLabel"></span>
          <svg viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5 6 6.5 11 1.5" stroke="#8B95A1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <select id="picker" aria-label="분류 선택"></select>
        </div>
      </div>
    </div>
  </div>

  <div class="sheet">
    <div class="list" id="list"></div>
  </div>
</div>

<script>
const AXES = [
  ["llm", "LLM/서비스"],
  ["media", "영상/이미지"],
  ["hardware", "하드웨어"],
  ["capital", "기업/자본"],
];
const AXIS_NAME = Object.fromEntries(AXES);
// 분류 선택은 제목과 한 줄에 놓이므로 짧은 이름을 쓴다.
const SHORT_NAME = { all: "전체", llm: "LLM", media: "영상", hardware: "하드웨어", capital: "기업" };
const BADGE = { surge: ["급상승", "surge"], new: ["새로 진입", "new"] };
const SECTIONS = [["all", "전체"]].concat(AXES);
const SECTION_LIMIT = 20;
const SOURCE_LIMIT = 3;
const COMPACT_AT = 8;
const STORE_SECTION = "ai-issues.section";
/* 기업 로고. 두 곳을 차례로 시도한다.
   1. Simple Icons — 브랜드 색을 입힌 SVG 라 어떤 크기에서도 선명하다.
      다만 상표 정책상 빠진 브랜드가 있다.
   2. 구글 파비콘 — 거의 모든 도메인에 있지만 원본이 작으면 흐리다.
   둘은 서로 빠진 곳을 메운다. */
const LOGO_VECTOR = "https://cdn.simpleicons.org/%s";
const LOGO_FAVICON = "https://www.google.com/s2/favicons?domain=%s&sz=256";

/* 도메인에서 Simple Icons 슬러그를 만든다. anthropic.com -> anthropic */
function logoSlug(domain) {
  return domain.split(".")[0].replace(/[^a-z0-9]/g, "");
}

const app = document.getElementById("app");
const topbar = document.getElementById("topbar");
const picker = document.getElementById("picker");
const pickerLabel = document.getElementById("pickerLabel");
const listEl = document.getElementById("list");

let data = { issues: [] };
let section = read(STORE_SECTION, "all");
if (!SECTIONS.some(([key]) => key === section)) section = "all";

function read(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (e) { return fallback; }
}
function write(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

function ago(iso) {
  if (!iso) return "";
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "방금 전";
  if (mins < 60) return mins + "분 전";
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + "시간 전";
  return Math.floor(hours / 24) + "일 전";
}

function arrow(issue) {
  if (issue.prev_rank == null) return "";
  const diff = issue.prev_rank - issue.rank;
  if (diff > 0) return '<span class="arrow up">▲</span>';
  if (diff < 0) return '<span class="arrow down">▼</span>';
  return "";
}

function escape(text) {
  return String(text == null ? "" : text).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- 그리기 ---------- */

/* 사진이 있으면 사진을, 없으면 기업 로고를 보여준다. 둘 다 없으면 자리를 비운다. */
function thumbHtml(issue) {
  const fallback = 'onerror="this.parentElement.remove()"';
  if (issue.image) {
    return `<div class="thumb-box photo"><img class="thumb" src="${escape(issue.image)}" alt=""
      loading="lazy" referrerpolicy="no-referrer" ${fallback}></div>`;
  }
  if (issue.company_domain) {
    const domain = encodeURIComponent(issue.company_domain);
    const vector = LOGO_VECTOR.replace("%s", logoSlug(issue.company_domain));
    const favicon = LOGO_FAVICON.replace("%s", domain);
    return `<div class="thumb-box"><img class="thumb logo" src="${vector}" alt=""
      loading="lazy" referrerpolicy="no-referrer" data-next="${favicon}"
      onerror="if(this.dataset.next){this.src=this.dataset.next;delete this.dataset.next;}else{this.parentElement.remove();}"></div>`;
  }
  return "";
}

function rowHtml(issue, position) {
  const badge = BADGE[issue.badge];
  const all = issue.sources || [];
  const sources = all.slice(0, SOURCE_LIMIT).map(s =>
    `<a href="${escape(s.url)}" target="_blank" rel="noopener"
      ><span class="name">${escape(s.name)}</span
      ><span class="when">${ago(s.published_at)}</span></a>`).join("");
  const more = all.length > SOURCE_LIMIT
    ? `<p class="more">외 ${all.length - SOURCE_LIMIT}개 출처</p>` : "";
  // 요약이 없는 이슈는 이 필드를 넣기 전에 만들어진 것이다. 부제로 대신한다.
  const detail = issue.summary || issue.subtitle;

  return `<div class="row">
    <div class="head">
      <div class="rank">${position}${arrow(issue)}</div>
      <div>
        <div class="titleline">
          <span class="title">${escape(issue.title)}</span>
          ${badge ? `<span class="badge ${badge[1]}">${badge[0]}</span>` : ""}
        </div>
        <div class="meta">
          <span class="axis">${AXIS_NAME[issue.axis] || issue.axis}</span>
          <span class="count">${issue.source_count}개 출처 · ${ago(issue.last_seen)}</span>
        </div>
      </div>
      ${thumbHtml(issue)}
    </div>
    <div class="sources">
      <p class="detail">${escape(detail)}</p>
      ${sources}
      ${more}
    </div>
  </div>`;
}

function renderPicker() {
  picker.innerHTML = SECTIONS.map(([key]) =>
    `<option value="${key}"${key === section ? " selected" : ""}>${SHORT_NAME[key]}</option>`).join("");
  pickerLabel.textContent = SHORT_NAME[section];
}

function renderList() {
  const issues = (section === "all"
    ? data.issues.slice()
    : data.issues.filter(i => i.axis === section))
    .sort((a, b) => String(b.last_seen || "").localeCompare(String(a.last_seen || "")))
    .slice(0, SECTION_LIMIT);

  listEl.innerHTML = issues.length
    ? issues.map((issue, i) => rowHtml(issue, i + 1)).join("")
    : '<div class="empty">이 분류에 표시할 이슈가 없다.</div>';
}

/* ---------- 동작 ---------- */

picker.addEventListener("change", () => {
  section = picker.value;
  pickerLabel.textContent = SHORT_NAME[section];
  write(STORE_SECTION, section);
  renderList();
  window.scrollTo(0, 0);
});

listEl.addEventListener("click", event => {
  const head = event.target.closest(".head");
  if (head) head.parentElement.classList.toggle("open");
});

/* 문서를 내리면 헤더를 접는다. */
let ticking = false;
window.addEventListener("scroll", () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    app.classList.toggle("compact", window.scrollY > COMPACT_AT);
    ticking = false;
  });
}, { passive: true });

/* ---------- 시작 ---------- */

fetch("../data/issues.json", { cache: "no-store" })
  .then(response => response.json())
  .then(json => {
    data = json;
    renderPicker();
    renderList();
  })
  .catch(() => {
    listEl.innerHTML = '<div class="error">데이터를 불러오지 못했다.</div>';
  });
</script>
</body>
</html>

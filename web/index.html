<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF3FB">
<title>AI 실시간 이슈</title>
<style>
  :root {
    --bg-top: #E8F0FD;
    --bg: #F4F6F9;
    --card: #FFFFFF;
    --text: #191F28;
    --text-sub: #8B95A1;
    --text-dim: #B0B8C1;
    --up: #F04452;
    --down: #3182F6;
    --accent: #3182F6;
    --badge-hot-bg: #FEECEE;
    --badge-hot-fg: #F04452;
    --badge-new-bg: #EDF3FE;
    --badge-new-fg: #3182F6;
    --seg-on-bg: #E5E9EE;
    --tab-line: #E2E7EC;
    --chip-off-bg: #EDF0F3;
    --line: #F0F2F5;
    --radius: 16px;
    --gutter: 20px;
    --shadow: 0 3px 10px rgba(17,24,39,.07);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0; position: relative;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard,
                 "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .sky {
    position: absolute; inset: 0 0 auto 0; height: 340px; z-index: 0;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 100%);
  }

  .wrap {
    position: relative; z-index: 1;
    max-width: 560px; margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 0 calc(48px + env(safe-area-inset-bottom));
  }
  .pad { padding: 0 var(--gutter); }

  /* ---------- 헤더 ---------- */
  .eyebrow {
    display: flex; align-items: center; gap: 6px;
    color: var(--accent); font-size: 15px; font-weight: 700;
    line-height: 1; margin: 28px 0 8px;
  }
  .eyebrow svg { width: 21px; height: 21px; display: block; flex: none; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }

  .bar { display: flex; align-items: center; gap: 8px; margin: 24px 0 14px; }
  .seg { display: flex; gap: 4px; }
  .seg button {
    border: 0; background: transparent; cursor: pointer;
    font: inherit; font-size: 15px; font-weight: 700;
    color: var(--text-dim); padding: 8px 14px;
    border-radius: 13px; corner-shape: squircle;
  }
  .seg button[aria-pressed="true"] { background: var(--seg-on-bg); color: var(--text); }
  .updated { margin-left: auto; font-size: 13px; color: var(--text-dim); }

  /* ---------- 탭 ---------- */
  .tabs {
    overflow-x: auto; margin-bottom: 14px;
    border-bottom: 1px solid var(--tab-line);
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabrow { position: relative; display: flex; padding: 0 12px; width: max-content; min-width: 100%; }
  .tabrow button {
    flex: none; border: 0; background: transparent; cursor: pointer; font: inherit;
    font-size: 16px; font-weight: 700; letter-spacing: -0.3px;
    color: var(--text-dim); padding: 10px 12px 13px; white-space: nowrap;
    transition: color .18s;
  }
  .tabrow button[aria-current="true"] { color: var(--text); }
  .ink {
    position: absolute; left: 0; bottom: 0; height: 2.5px; width: 100px;
    border-radius: 2px; background: var(--text);
    transform-origin: left center; transform: translateX(0) scaleX(0);
    will-change: transform;
  }

  /* ---------- 페이저 ---------- */
  .pager {
    display: flex; align-items: flex-start;
    overflow: hidden; touch-action: pan-y;
    transition: height .22s ease;
  }
  .page {
    flex: 0 0 100%; width: 100%; min-width: 0;
    padding: 0 var(--gutter);
    contain: layout paint;
    content-visibility: auto;
    contain-intrinsic-size: auto 600px;
  }

  /* ---------- 카드 ---------- */
  .list { display: flex; flex-direction: column; gap: 10px; }

  .card-shell { border-radius: var(--radius); box-shadow: var(--shadow); }
  .card {
    background: var(--card);
    border-radius: var(--radius); corner-shape: squircle;
    overflow: hidden;
  }
  .head {
    display: grid; grid-template-columns: 28px minmax(0, 1fr);
    gap: 11px; align-items: start;
    padding: 18px 16px; cursor: pointer;
  }
  .head > div { min-width: 0; }
  .rank {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    font-size: 17px; font-weight: 700; line-height: 1.45;
  }

  .titleline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.45; }

  .badge {
    font-size: 11px; font-weight: 700; padding: 3px 7px;
    border-radius: 7px; corner-shape: squircle; white-space: nowrap;
  }
  .badge.surge { background: var(--badge-hot-bg); color: var(--badge-hot-fg); }
  .badge.new   { background: var(--badge-new-bg); color: var(--badge-new-fg); }

  .subline { margin-top: 4px; }
  .arrow { font-size: 13px; line-height: 1; }
  .arrow.up { color: var(--up); }
  .arrow.down { color: var(--down); }
  .subtitle {
    display: block; font-size: 15px; color: var(--text-sub); letter-spacing: -0.2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }

  .meta { display: flex; align-items: center; gap: 6px; margin-top: 9px; }
  .axis {
    font-size: 11px; font-weight: 600; color: var(--text-dim);
    background: var(--chip-off-bg); padding: 2px 7px; border-radius: 5px;
  }
  .count { font-size: 13px; color: var(--text-dim); font-weight: 500; }

  .sources { display: none; border-top: 1px solid var(--line); padding: 6px 16px 10px; }
  .card.open .sources { display: block; }
  .sources a {
    display: block; padding: 11px 0; text-decoration: none; color: var(--text);
    border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.5;
  }
  .sources a:last-child { border-bottom: 0; }
  .sources .name { color: var(--text-dim); font-size: 12px; display: block; margin-top: 3px; }

  .empty, .error {
    background: var(--card); border-radius: var(--radius); padding: 40px 20px;
    text-align: center; color: var(--text-sub); font-size: 15px; box-shadow: var(--shadow);
  }
</style>
</head>
<body>
<div class="sky"></div>
<div class="wrap">
  <div class="pad">
    <div class="eyebrow">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 6.1L20.5 10l-6.3 1.9L12 18l-2.2-6.1L3.5 10l6.3-1.9L12 2z"/></svg>
      AI 소식을 모아서
    </div>
    <h1>지금 많이 언급되는 이슈</h1>

    <div class="bar">
      <div class="seg" id="sort">
        <button data-sort="popular" aria-pressed="true">인기순</button>
        <button data-sort="recent" aria-pressed="false">최신순</button>
      </div>
      <span class="updated" id="updated"></span>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tabrow" id="tabrow"><span class="ink" id="ink"></span></div>
  </div>
  <div class="pager" id="pager"></div>
</div>

<script>
const AXES = [
  ["llm", "LLM/서비스"],
  ["media", "영상/이미지"],
  ["hardware", "하드웨어"],
  ["capital", "기업/자본"],
];
const AXIS_NAME = Object.fromEntries(AXES);
const BADGE = { surge: ["급상승", "surge"], new: ["새로 진입", "new"] };
const SECTIONS = [["all", "전체"]].concat(AXES);
const SECTION_LIMIT = 20;
const STORE_SECTION = "ai-issues.section";
const STORE_SORT = "ai-issues.sort";

const tabs = document.getElementById("tabs");
const tabrow = document.getElementById("tabrow");
const ink = document.getElementById("ink");
const pager = document.getElementById("pager");

let data = { issues: [] };
let sort = read(STORE_SORT, "popular");
let index = Math.max(0, SECTIONS.findIndex(([k]) => k === read(STORE_SECTION, "all")));

function read(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (e) { return fallback; }
}
function write(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

function ago(iso) {
  if (!iso) return "";
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "방금 전";
  if (mins < 60) return mins + "분 전";
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + "시간 전";
  return Math.floor(hours / 24) + "일 전";
}

function arrow(issue) {
  if (issue.prev_rank == null) return "";
  const diff = issue.prev_rank - issue.rank;
  if (diff > 0) return '<span class="arrow up">▲</span>';
  if (diff < 0) return '<span class="arrow down">▼</span>';
  return "";
}

function escape(text) {
  return String(text == null ? "" : text).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- 그리기 ---------- */

function issuesFor(key) {
  let list = key === "all"
    ? data.issues.slice()
    : data.issues.filter(i => i.axis === key);
  if (sort === "recent") {
    list.sort((a, b) => String(b.last_seen || "").localeCompare(String(a.last_seen || "")));
  } else {
    list.sort((a, b) => a.rank - b.rank);
  }
  return list.slice(0, SECTION_LIMIT);
}

function cardHtml(issue, position) {
  const badge = BADGE[issue.badge];
  const sources = (issue.sources || []).map(s =>
    `<a href="${escape(s.url)}" target="_blank" rel="noopener">${escape(s.name)}
       <span class="name">${ago(s.published_at)}</span></a>`).join("");
  return `<div class="card-shell"><div class="card">
    <div class="head">
      <div class="rank">${position}${arrow(issue)}</div>
      <div>
        <div class="titleline">
          <span class="title">${escape(issue.title)}</span>
          ${badge ? `<span class="badge ${badge[1]}">${badge[0]}</span>` : ""}
        </div>
        <div class="subline"><span class="subtitle">${escape(issue.subtitle)}</span></div>
        <div class="meta">
          <span class="axis">${AXIS_NAME[issue.axis] || issue.axis}</span>
          <span class="count">${issue.source_count}개 출처 · ${ago(issue.last_seen)}</span>
        </div>
      </div>
    </div>
    <div class="sources">${sources}</div>
  </div></div>`;
}

function renderTabs() {
  tabrow.querySelectorAll("button").forEach(b => b.remove());
  SECTIONS.forEach(([key, label], i) => {
    const button = document.createElement("button");
    button.textContent = label;
    button.dataset.index = i;
    button.setAttribute("aria-current", String(i === index));
    tabrow.insertBefore(button, ink);
  });
}

function renderPages() {
  pager.innerHTML = SECTIONS.map(([key]) => {
    const list = issuesFor(key);
    const body = list.length
      ? list.map((issue, i) => cardHtml(issue, i + 1)).join("")
      : '<div class="empty">이 섹션에 표시할 이슈가 없다.</div>';
    return `<div class="page"><div class="list">${body}</div></div>`;
  }).join("");
}

/* ---------- 탭 밑줄과 페이저 연동 ---------- */

const INK_BASE = 100;   // 밑줄의 기준 폭. 실제 폭은 scaleX로 만든다.
let tabGeometry = [];
let inkNear = -1;

function tabAt(i) {
  return tabrow.querySelectorAll("button")[Math.max(0, Math.min(SECTIONS.length - 1, i))];
}

/* 탭의 위치와 폭을 미리 재둔다. 끄는 동안 레이아웃을 다시 읽지 않기 위해서다. */
function measureTabs() {
  tabGeometry = [...tabrow.querySelectorAll("button")].map(button => ({
    left: button.offsetLeft + 10,
    width: Math.max(0, button.offsetWidth - 20),
  }));
}

function moveInk() {
  if (!tabGeometry.length) return;
  const width = pager.clientWidth || 1;
  const ratio = Math.max(0, Math.min(SECTIONS.length - 1, pager.scrollLeft / width));
  const i = Math.floor(ratio);
  const f = ratio - i;
  const a = tabGeometry[i];
  const b = tabGeometry[Math.min(i + 1, tabGeometry.length - 1)];
  if (!a || !b) return;
  const left = a.left + (b.left - a.left) * f;
  const w = a.width + (b.width - a.width) * f;
  ink.style.transform = `translateX(${left}px) scaleX(${w / INK_BASE})`;

  const near = Math.round(ratio);
  if (near !== inkNear) {
    inkNear = near;
    tabrow.querySelectorAll("button").forEach((button, n) =>
      button.setAttribute("aria-current", String(n === near)));
  }
}

/* 페이저가 화면 아래까지 닿게 한다. 카드가 없는 바닥에서도 스와이프가 먹혀야 한다. */
function syncHeight() {
  const page = pager.children[index];
  if (!page) return;
  const floor = Math.max(0, window.innerHeight - pager.offsetTop);
  pager.style.height = Math.max(page.offsetHeight, floor) + "px";
}

let settleGuard = null;

function goTo(next, smooth) {
  index = Math.max(0, Math.min(SECTIONS.length - 1, next));
  write(STORE_SECTION, SECTIONS[index][0]);
  const target = index * pager.clientWidth;
  const behavior = smooth === false ? "auto" : "smooth";
  pager.scrollTo({ left: target, behavior });
  tabAt(index).scrollIntoView({ behavior, inline: "center", block: "nearest" });
  syncHeight();
  moveInk();

  // 부드러운 이동이 끝까지 가지 않는 경우가 있어서 마지막 위치를 맞춘다.
  clearTimeout(settleGuard);
  settleGuard = setTimeout(() => {
    if (Math.abs(pager.scrollLeft - target) > 1) {
      pager.scrollLeft = target;
      moveInk();
    }
    syncHeight();
  }, 450);
}

let ticking = false;
pager.addEventListener("scroll", () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => { moveInk(); ticking = false; });
}, { passive: true });

/* 손가락을 따라 화면이 움직인다. 한 번에 한 페이지까지만 이동한다. */
const DRAG_TRIGGER = 0.16;   // 페이지 폭 대비 이 비율을 넘기면 옆으로 넘어간다.
const DRAG_DEADZONE = 6;
let dragX = 0, dragY = 0, dragFrom = 0, dragging = false, axis = null;

pager.addEventListener("touchstart", event => {
  if (event.touches.length !== 1) return;
  dragX = event.touches[0].clientX;
  dragY = event.touches[0].clientY;
  dragFrom = index * pager.clientWidth;
  dragging = true;
  axis = null;
  pager.style.transition = "none";
}, { passive: true });

pager.addEventListener("touchmove", event => {
  if (!dragging) return;
  const dx = event.touches[0].clientX - dragX;
  const dy = event.touches[0].clientY - dragY;

  if (axis === null) {
    if (Math.abs(dx) < DRAG_DEADZONE && Math.abs(dy) < DRAG_DEADZONE) return;
    axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if (axis === "y") { dragging = false; pager.style.transition = ""; return; }
  }

  const width = pager.clientWidth;
  const min = Math.max(0, index - 1) * width;
  const max = Math.min(SECTIONS.length - 1, index + 1) * width;
  pager.scrollLeft = Math.max(min, Math.min(max, dragFrom - dx));
  if (!ticking) {
    ticking = true;
    requestAnimationFrame(() => { moveInk(); ticking = false; });
  }
  event.preventDefault();
}, { passive: false });

pager.addEventListener("touchend", event => {
  if (!dragging) return;
  dragging = false;
  pager.style.transition = "";
  if (axis !== "x") return;
  const dx = event.changedTouches[0].clientX - dragX;
  const step = Math.abs(dx) > pager.clientWidth * DRAG_TRIGGER ? (dx < 0 ? 1 : -1) : 0;
  goTo(index + step);
}, { passive: true });

pager.addEventListener("touchcancel", () => {
  if (!dragging) return;
  dragging = false;
  pager.style.transition = "";
  goTo(index);
}, { passive: true });

tabrow.addEventListener("click", event => {
  const button = event.target.closest("button");
  if (button) goTo(Number(button.dataset.index));
});

pager.addEventListener("click", event => {
  const head = event.target.closest(".head");
  if (!head) return;
  head.parentElement.classList.toggle("open");
  applySquircle();
  setTimeout(syncHeight, 30);
});

document.getElementById("sort").addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button || button.dataset.sort === sort) return;
  sort = button.dataset.sort;
  write(STORE_SORT, sort);
  document.querySelectorAll("#sort button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.sort === sort)));
  renderPages();
  goTo(index, false);
  applySquircle();
});

window.addEventListener("resize", () => { measureTabs(); goTo(index, false); });

/* ---------- 스쿼클 모서리 ---------- */

const SQUIRCLE = [[".card", 20], [".seg button", 13]];
const SMOOTHING = 0.7;
let getSvgPath = null;
let squircleObserver = null;

import("https://cdn.jsdelivr.net/npm/figma-squircle@1.1.0/+esm")
  .then(module => {
    getSvgPath = module.getSvgPath;
    squircleObserver = new ResizeObserver(entries => {
      for (const entry of entries) shape(entry.target);
    });
    applySquircle();
  })
  .catch(() => {});

function shape(el) {
  const radius = Number(el.dataset.squircleRadius);
  const box = el.getBoundingClientRect();
  if (!box.width || !box.height) return;
  el.style.clipPath = `path('${getSvgPath({
    width: box.width, height: box.height,
    cornerRadius: radius, cornerSmoothing: SMOOTHING,
  })}')`;
}

function applySquircle() {
  if (!getSvgPath) return;
  for (const [selector, radius] of SQUIRCLE) {
    document.querySelectorAll(selector).forEach(el => {
      el.dataset.squircleRadius = radius;
      shape(el);
      squircleObserver.observe(el);
    });
  }
}

/* ---------- 시작 ---------- */

fetch("../data/issues.json", { cache: "no-store" })
  .then(response => response.json())
  .then(json => {
    data = json;
    document.getElementById("updated").textContent = ago(json.generated_at);
    document.querySelectorAll("#sort button").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.sort === sort)));
    renderTabs();
    renderPages();
    requestAnimationFrame(() => {
      measureTabs();
      goTo(index, false);
      applySquircle();
    });
  })
  .catch(() => {
    pager.innerHTML = '<div class="page"><div class="error">데이터를 불러오지 못했다.</div></div>';
  });
</script>
</body>
</html>

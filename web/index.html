<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8F0FD">
<title>AI 실시간 이슈</title>
<style>
  :root {
    --bg-top: #E8F0FD;
    --bg: #F4F6F9;
    --card: #FFFFFF;
    --text: #191F28;
    --text-sub: #8B95A1;
    --text-dim: #B0B8C1;
    --up: #F04452;
    --down: #3182F6;
    --accent: #3182F6;
    --badge-hot-bg: #FEECEE;
    --badge-hot-fg: #F04452;
    --badge-new-bg: #EDF3FE;
    --badge-new-fg: #3182F6;
    --seg-on-bg: #E5E9EE;
    --tab-line: #E2E7EC;
    --chip-bg: #EDF0F3;
    --line: #F0F2F5;
    --radius: 16px;
    --gutter: 20px;
    --shadow: 0 2px 6px rgba(17,24,39,.05), 0 8px 20px rgba(17,24,39,.05);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* 문서 자체는 스크롤하지 않는다. 섹션마다 자기 영역을 스크롤한다.
     주소 표시줄이 접히고 펴지지 않아서 화면이 튀지 않는다. */
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--bg-top);
  }

  body {
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard,
                 "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 고정 배치라서 body 의 overflow: hidden 에 잘리지 않는다.
     높이를 100vh 로 두면 하단 도구 막대 뒤까지 이어진다. */
  .app {
    position: fixed; top: 0; left: 0; right: 0; margin: 0 auto;
    max-width: 560px; height: 100vh;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
    background: linear-gradient(180deg, var(--bg-top) 0, var(--bg) 340px) no-repeat,
                var(--bg);
  }

  /* ---------- 헤더 ----------
     목록을 올리면 눈썹 문구가 사라지고 제목이 한 줄로 줄어든다. */
  .head-area { flex: none; padding: 0 var(--gutter); }

  .eyebrow {
    display: flex; align-items: center; gap: 6px; overflow: hidden;
    color: var(--accent); font-size: 15px; font-weight: 700;
    line-height: 1; height: 21px; margin: 22px 0 8px; opacity: 1;
    transform-origin: left center; will-change: transform, opacity;
    transition: height .24s cubic-bezier(.22,.61,.36,1),
                margin .24s cubic-bezier(.22,.61,.36,1),
                transform .24s cubic-bezier(.22,.61,.36,1),
                opacity .16s linear;
  }
  .eyebrow svg { width: 21px; height: 21px; display: block; flex: none; }

  .titlebar { display: flex; align-items: center; gap: 10px; }
  h1 {
    margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px;
    transform-origin: left center; will-change: transform;
    transition: transform .24s cubic-bezier(.22,.61,.36,1);
  }
  .actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }

  .bar {
    display: flex; align-items: center; gap: 8px; margin: 18px 0 12px;
    transition: margin .24s cubic-bezier(.22,.61,.36,1);
  }

  .compact .eyebrow { height: 0; margin: 14px 0 0; opacity: 0; transform: translateY(-8px); }
  .compact h1 { transform: scale(.7); }
  .compact .bar { margin: 10px 0 8px; }
  .seg { display: flex; gap: 4px; }
  .seg button {
    border: 0; background: transparent; cursor: pointer;
    font: inherit; font-size: 15px; font-weight: 700;
    color: var(--text-dim); padding: 8px 14px; border-radius: 13px;
  }
  .seg button[aria-pressed="true"] { background: var(--seg-on-bg); color: var(--text); }
  .updated { margin-left: auto; font-size: 13px; color: var(--text-dim); }

  /* ---------- 탭 ---------- */
  .tabs {
    flex: none; overflow-x: auto;
    border-bottom: 1px solid var(--tab-line);
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabrow { position: relative; display: flex; padding: 0 12px; width: max-content; min-width: 100%; }
  .tabrow button {
    flex: none; border: 0; background: transparent; cursor: pointer; font: inherit;
    font-size: 16px; font-weight: 700; letter-spacing: -0.3px;
    color: var(--text-dim); padding: 10px 12px 13px; white-space: nowrap;
    transition: color .18s;
  }
  .tabrow button[aria-current="true"] { color: var(--text); }
  .ink {
    position: absolute; left: 0; bottom: 0; height: 2.5px; width: 100px;
    border-radius: 2px; background: var(--text);
    transform-origin: left center; transform: translateX(0) scaleX(0);
    will-change: transform;
  }

  /* ---------- 페이저 ----------
     가로 이동은 브라우저의 스크롤 스냅에 맡긴다. scroll-snap-stop: always 가
     한 번에 한 페이지씩만 넘어가게 한다. 세로는 페이지가 각자 스크롤한다. */
  .pager {
    flex: 1; min-height: 0;
    display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; overscroll-behavior: contain;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .pager::-webkit-scrollbar { display: none; }

  .page {
    flex: 0 0 100%; width: 100%; min-width: 0; height: 100%;
    scroll-snap-align: start; scroll-snap-stop: always;
    overflow-y: auto; overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch;
    padding: 14px var(--gutter) calc(110px + env(safe-area-inset-bottom));
  }
  .page::-webkit-scrollbar { display: none; }

  /* ---------- 카드 ---------- */
  .list { display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .head {
    display: grid; grid-template-columns: 28px minmax(0, 1fr);
    gap: 11px; align-items: start;
    padding: 18px 16px; cursor: pointer;
  }
  .head > div { min-width: 0; }
  .rank {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    font-size: 17px; font-weight: 700; line-height: 1.45;
  }

  .titleline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.45; }

  .badge {
    font-size: 11px; font-weight: 700; padding: 3px 7px;
    border-radius: 7px; white-space: nowrap;
  }
  .badge.surge { background: var(--badge-hot-bg); color: var(--badge-hot-fg); }
  .badge.new   { background: var(--badge-new-bg); color: var(--badge-new-fg); }

  .subline { margin-top: 4px; }
  .arrow { font-size: 13px; line-height: 1; }
  .arrow.up { color: var(--up); }
  .arrow.down { color: var(--down); }
  .subtitle {
    display: block; font-size: 15px; color: var(--text-sub); letter-spacing: -0.2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .meta { display: flex; align-items: center; gap: 6px; margin-top: 9px; }
  .axis {
    font-size: 11px; font-weight: 600; color: var(--text-dim);
    background: var(--chip-bg); padding: 2px 7px; border-radius: 5px;
  }
  .count { font-size: 13px; color: var(--text-dim); font-weight: 500; }

  .sources { display: none; border-top: 1px solid var(--line); padding: 6px 16px 10px; }
  .card.open .sources { display: block; }
  .sources a {
    display: block; padding: 11px 0; text-decoration: none; color: var(--text);
    border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.5;
  }
  .sources a:last-child { border-bottom: 0; }
  .sources .when { color: var(--text-dim); font-size: 12px; display: block; margin-top: 3px; }

  .empty, .error {
    background: var(--card); border-radius: var(--radius); padding: 40px 20px;
    text-align: center; color: var(--text-sub); font-size: 15px; box-shadow: var(--shadow);
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="head-area">
    <div class="eyebrow">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 6.1L20.5 10l-6.3 1.9L12 18l-2.2-6.1L3.5 10l6.3-1.9L12 2z"/></svg>
      AI 소식을 모아서
    </div>
    <div class="titlebar">
      <h1>지금 많이 언급되는 이슈</h1>
      <div class="actions" id="actions"></div>
    </div>

    <div class="bar">
      <div class="seg" id="sort">
        <button data-sort="recent" aria-pressed="true">최신순</button>
        <button data-sort="popular" aria-pressed="false">인기순</button>
      </div>
      <span class="updated" id="updated"></span>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tabrow" id="tabrow"><span class="ink" id="ink"></span></div>
  </div>

  <div class="pager" id="pager"></div>
</div>

<script>
const AXES = [
  ["llm", "LLM/서비스"],
  ["media", "영상/이미지"],
  ["hardware", "하드웨어"],
  ["capital", "기업/자본"],
];
const AXIS_NAME = Object.fromEntries(AXES);
const BADGE = { surge: ["급상승", "surge"], new: ["새로 진입", "new"] };
const SECTIONS = [["all", "전체"]].concat(AXES);
const SECTION_LIMIT = 20;
const INK_BASE = 100;
const STORE_SECTION = "ai-issues.section";
const STORE_SORT = "ai-issues.sort";

const tabs = document.getElementById("tabs");
const tabrow = document.getElementById("tabrow");
const ink = document.getElementById("ink");
const pager = document.getElementById("pager");
const app = document.getElementById("app");

let data = { issues: [] };
let sort = read(STORE_SORT, "recent");
let index = Math.max(0, SECTIONS.findIndex(([k]) => k === read(STORE_SECTION, "all")));
let geometry = [];
let near = -1;

function read(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (e) { return fallback; }
}
function write(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

function ago(iso) {
  if (!iso) return "";
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "방금 전";
  if (mins < 60) return mins + "분 전";
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + "시간 전";
  return Math.floor(hours / 24) + "일 전";
}

function arrow(issue) {
  if (issue.prev_rank == null) return "";
  const diff = issue.prev_rank - issue.rank;
  if (diff > 0) return '<span class="arrow up">▲</span>';
  if (diff < 0) return '<span class="arrow down">▼</span>';
  return "";
}

function escape(text) {
  return String(text == null ? "" : text).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- 그리기 ---------- */

function issuesFor(key) {
  const list = key === "all"
    ? data.issues.slice()
    : data.issues.filter(i => i.axis === key);
  if (sort === "recent") {
    list.sort((a, b) => String(b.last_seen || "").localeCompare(String(a.last_seen || "")));
  } else {
    list.sort((a, b) => a.rank - b.rank);
  }
  return list.slice(0, SECTION_LIMIT);
}

function cardHtml(issue, position) {
  const badge = BADGE[issue.badge];
  const sources = (issue.sources || []).map(s =>
    `<a href="${escape(s.url)}" target="_blank" rel="noopener">${escape(s.name)}
       <span class="when">${ago(s.published_at)}</span></a>`).join("");
  return `<div class="card">
    <div class="head">
      <div class="rank">${position}${arrow(issue)}</div>
      <div>
        <div class="titleline">
          <span class="title">${escape(issue.title)}</span>
          ${badge ? `<span class="badge ${badge[1]}">${badge[0]}</span>` : ""}
        </div>
        <div class="subline"><span class="subtitle">${escape(issue.subtitle)}</span></div>
        <div class="meta">
          <span class="axis">${AXIS_NAME[issue.axis] || issue.axis}</span>
          <span class="count">${issue.source_count}개 출처 · ${ago(issue.last_seen)}</span>
        </div>
      </div>
    </div>
    <div class="sources">${sources}</div>
  </div>`;
}

function renderTabs() {
  tabrow.querySelectorAll("button").forEach(b => b.remove());
  SECTIONS.forEach(([, label], i) => {
    const button = document.createElement("button");
    button.textContent = label;
    button.dataset.index = i;
    button.setAttribute("aria-current", String(i === index));
    tabrow.insertBefore(button, ink);
  });
  geometry = [...tabrow.querySelectorAll("button")].map(b => ({
    left: b.offsetLeft + 10,
    width: Math.max(0, b.offsetWidth - 20),
  }));
}

function renderPages() {
  pager.innerHTML = SECTIONS.map(([key]) => {
    const list = issuesFor(key);
    const body = list.length
      ? list.map((issue, i) => cardHtml(issue, i + 1)).join("")
      : '<div class="empty">이 섹션에 표시할 이슈가 없다.</div>';
    return `<div class="page"><div class="list">${body}</div></div>`;
  }).join("");
  [...pager.children].forEach(page =>
    page.addEventListener("scroll", () => syncHeader(page), { passive: true }));
}

/* 목록을 올리면 헤더를 접고, 맨 위로 돌아오면 편다. */
const COMPACT_AT = 8;
function syncHeader(page) {
  if (page !== pager.children[index]) return;
  app.classList.toggle("compact", page.scrollTop > COMPACT_AT);
}

/* ---------- 탭 밑줄 ----------
   페이저의 스크롤 위치를 두 탭 사이에서 보간해 밑줄을 옮긴다.
   가로 이동은 브라우저가 처리하므로 여기서는 위치만 읽는다. */

function moveInk() {
  if (!geometry.length) return;
  const width = pager.clientWidth || 1;
  const ratio = Math.max(0, Math.min(SECTIONS.length - 1, pager.scrollLeft / width));
  const i = Math.floor(ratio);
  const f = ratio - i;
  const a = geometry[i];
  const b = geometry[Math.min(i + 1, geometry.length - 1)];
  if (!a || !b) return;
  const left = a.left + (b.left - a.left) * f;
  const w = a.width + (b.width - a.width) * f;
  ink.style.transform = `translateX(${left}px) scaleX(${w / INK_BASE})`;

  const now = Math.round(ratio);
  if (now !== near) {
    near = now;
    index = now;
    write(STORE_SECTION, SECTIONS[index][0]);
    tabrow.querySelectorAll("button").forEach((button, n) =>
      button.setAttribute("aria-current", String(n === now)));
    centerTab();
    syncHeader(pager.children[index]);
  }
}

function centerTab() {
  const button = tabrow.querySelectorAll("button")[index];
  if (!button) return;
  const want = button.offsetLeft + button.offsetWidth / 2 - tabs.clientWidth / 2;
  const max = Math.max(0, tabs.scrollWidth - tabs.clientWidth);
  tabs.scrollTo({ left: Math.max(0, Math.min(max, want)), behavior: "smooth" });
}

let ticking = false;
pager.addEventListener("scroll", () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => { moveInk(); ticking = false; });
}, { passive: true });

tabrow.addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button) return;
  pager.scrollTo({ left: Number(button.dataset.index) * pager.clientWidth, behavior: "smooth" });
});

pager.addEventListener("click", event => {
  const head = event.target.closest(".head");
  if (head) head.parentElement.classList.toggle("open");
});

document.getElementById("sort").addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button || button.dataset.sort === sort) return;
  sort = button.dataset.sort;
  write(STORE_SORT, sort);
  document.querySelectorAll("#sort button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.sort === sort)));
  const keep = index;
  renderPages();
  pager.scrollLeft = keep * pager.clientWidth;
  moveInk();
});

/* ---------- 시작 ---------- */

fetch("../data/issues.json", { cache: "no-store" })
  .then(response => response.json())
  .then(json => {
    data = json;
    document.getElementById("updated").textContent = ago(json.generated_at);
    document.querySelectorAll("#sort button").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.sort === sort)));
    renderTabs();
    renderPages();
    pager.scrollLeft = index * pager.clientWidth;
    near = index;
    moveInk();
    centerTab();
  })
  .catch(() => {
    pager.innerHTML = '<div class="page"><div class="error">데이터를 불러오지 못했다.</div></div>';
  });
</script>
</body>
</html>
